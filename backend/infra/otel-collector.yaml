# M15 — colector OpenTelemetry para el sandbox. Recibe OTLP del BFF y lo saca
# por consola (debug). En producción: reemplazar el exporter por otlp/tempo/…
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
