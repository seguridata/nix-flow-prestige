# Tema de Tecate (demo de multitenancy). Hereda plantilla, fuentes y textos del
# tema `prestige`; solo cambia la paleta (rojo, plata, negro y blanco) y agrega
# el logo del cliente. La marca "PRESTIGE por SeguriData" se conserva igual.
parent=prestige

# `styles` del hijo reemplaza al del padre: se repiten los del padre y se agrega tecate.css.
styles=css/styles.css css/fonts.css css/prestige.css css/tecate.css
