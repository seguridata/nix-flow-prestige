name: prestige-sandbox

# Prestige local stack.
# Levanta: Postgres, Keycloak, Temporal (+ UI), MinIO, Redis.
# El BFF y el worker TypeScript corren en el host con `bun run dev`; opcionalmente
# en contenedor con `docker compose --profile app up -d --build` (ver bff/worker abajo).
# Postgres, Redis y Keycloak sólo escuchan en 127.0.0.1.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: keycloak,prestige,temporal,temporal_visibility
      POSTGRES_USER: ${POSTGRES_USER:-prestige}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prestige}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prestige}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-prestige}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-prestige}
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/prestige-realm.json:/opt/keycloak/data/import/prestige-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-prestige}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-prestige}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "false"
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3001
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  minio:
    # minio/minio ya no se publica en Docker Hub (minio/minio#21647).
    # alpine/minio reconstruye el mismo binario upstream. Hace falta
    # >= RELEASE.2025-05-20 para activar Object Lock en un bucket que ya
    # existe; el pin anterior (2025-04-22) solo lo aceptaba al crearlo.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # La imagen anterior corría como root y así quedó el volumen. Esta
    # corre como `minio` y no puede renombrar `.minio.sys` si no es root.
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-prestige}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-prestige-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    # minio/mc tampoco se publica ya en Docker Hub. rancher/mirrored-minio-mc es el
    # espejo de SUSE del mc upstream (tag RELEASE real, verificado con docker pull;
    # soporta `mb --with-lock`, `version enable` y `retention set --default`).
    image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        u="$${MINIO_ROOT_USER:-prestige}"
        p="$${MINIO_ROOT_PASSWORD:-prestige-minio}"
        ok=0
        i=0
        while [ "$$i" -lt 15 ]; do
          if mc alias set local http://minio:9000 "$$u" "$$p"; then
            ok=1
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        test "$$ok" = 1
        # --with-lock implica versionado. En un bucket nuevo lo deja activo
        # desde el primer objeto. Si el volumen ya tenía el bucket, se
        # enciende el versionado y el lock por defecto (GOVERNANCE 30d:
        # un admin con bypass puede corregir; COMPLIANCE no).
        if mc stat local/prestige-docs >/dev/null 2>&1; then
          mc version enable local/prestige-docs
        else
          mc mb --with-lock local/prestige-docs
        fi
        # `mc retention info` sale con código 0 aunque no haya retención por
        # defecto ("Object locking is not enabled."), así que no sirve de guarda.
        # `retention set --default` es idempotente: se aplica siempre.
        # mc 2023 se niega a activar el lock en un bucket YA existente creado sin él
        # ("does not support locking"): hay que recrear el bucket vacío con --with-lock.
        if ! mc retention set --default GOVERNANCE 30d local/prestige-docs; then
          echo 'ERROR: prestige-docs existe sin Object Lock; recréalo con mc mb --with-lock' >&2
          exit 1
        fi
        mc version info local/prestige-docs
        mc retention info --default local/prestige-docs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-prestige}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-prestige-minio}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # M15 — colector OpenTelemetry (opcional). `docker compose --profile observability up -d`.
  # El BFF exporta a http://localhost:4318 si OTEL_EXPORTER_OTLP_TRACES_ENDPOINT lo apunta.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # M13 — servidor SMTP de desarrollo. UI web en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI / API
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional (profile `app`): BFF en contenedor. Construye desde la raíz del monorepo.
  # Requiere backend/bff/.env (STORAGE_MASTER_KEY, WORKER_SHARED_SECRET, KEYCLOAK_*, ...)
  # y la PKI en backend/bff/pki. Aplica `prisma migrate deploy` al arrancar.
  bff:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/bff/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./bff/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prestige}:${POSTGRES_PASSWORD:-prestige}@postgres:5432/prestige?schema=public
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      RUN_MIGRATIONS: "true"
    volumes:
      - ./bff/pki:/app/backend/bff/pki:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  # Opcional (profile `app`): worker de Temporal (misma imagen, sin migrar).
  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/bff/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/temporal/worker.js"]
    env_file:
      - path: ./bff/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prestige}:${POSTGRES_PASSWORD:-prestige}@postgres:5432/prestige?schema=public
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
      BFF_INTERNAL_URL: http://bff:3000
      RUN_MIGRATIONS: "false"
    volumes:
      - ./bff/pki:/app/backend/bff/pki:ro
    depends_on:
      - bff
      - temporal

volumes:
  pgdata:
  miniodata:
