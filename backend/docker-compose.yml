name: prestige-sandbox

# Prestige local stack.
# Levanta: Postgres, Keycloak, Temporal (+ UI), MinIO, Redis.
# El BFF y el worker TypeScript corren en el host con `bun run dev`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: keycloak,prestige,temporal,temporal_visibility
      POSTGRES_USER: ${POSTGRES_USER:-prestige}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prestige}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prestige}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-prestige}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-prestige}
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/prestige-realm.json:/opt/keycloak/data/import/prestige-realm.json:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-prestige}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-prestige}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "false"
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3001
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  minio:
    # minio/minio ya no se publica en Docker Hub (minio/minio#21647).
    # alpine/minio reconstruye el mismo binario upstream. Hace falta
    # >= RELEASE.2025-05-20 para activar Object Lock en un bucket que ya
    # existe; el pin anterior (2025-04-22) solo lo aceptaba al crearlo.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # La imagen anterior corría como root y así quedó el volumen. Esta
    # corre como `minio` y no puede renombrar `.minio.sys` si no es root.
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-prestige}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-prestige-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        u="$${MINIO_ROOT_USER:-prestige}"
        p="$${MINIO_ROOT_PASSWORD:-prestige-minio}"
        ok=0
        i=0
        while [ "$$i" -lt 15 ]; do
          if mc alias set local http://minio:9000 "$$u" "$$p"; then
            ok=1
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        test "$$ok" = 1
        # --with-lock implica versionado. En un bucket nuevo lo deja activo
        # desde el primer objeto. Si el volumen ya tenía el bucket, se
        # enciende el versionado y el lock por defecto (GOVERNANCE 30d:
        # un admin con bypass puede corregir; COMPLIANCE no).
        if mc stat local/prestige-docs >/dev/null 2>&1; then
          mc version enable local/prestige-docs
        else
          mc mb --with-lock local/prestige-docs
        fi
        if ! mc retention info local/prestige-docs >/dev/null 2>&1; then
          mc retention set --default GOVERNANCE 30d local/prestige-docs
        fi
        mc version info local/prestige-docs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-prestige}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-prestige-minio}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # M15 — colector OpenTelemetry (opcional). `docker compose --profile observability up -d`.
  # El BFF exporta a http://localhost:4318 si OTEL_EXPORTER_OTLP_TRACES_ENDPOINT lo apunta.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # M13 — servidor SMTP de desarrollo. UI web en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI / API
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
