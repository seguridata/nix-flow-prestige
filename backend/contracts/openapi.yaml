components:
  securitySchemes:
    McpOAuth:
      type: oauth2
      description: Keycloak local defaults; deploy uses configured KEYCLOAK_ISSUER. Authorization code with PKCE S256
        and consent; resource audience required. No OAuth token endpoint is hosted by the BFF.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/prestige/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/prestige/protocol/openid-connect/token
          scopes:
            prestige:read: Read only actor/tenant-scoped Prestige tools
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    InboxEnvelopePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InboxEnvelope' } }
        nextCursor: { type: [string, 'null'] }
    InboxEnvelope:
      type: object
      required: [signatureRequestId, documentId, documentTitle, caseTitle, requestedByName, status, myStatus, methods, createdAt]
      properties:
