openapi: 3.1.0
info:
  title: Prestige - API del caso ancla
  version: 0.1.0
  description: >
    Contratos minimos para probar de punta a punta el caso ancla (contrato
    corporativo de dos partes) descrito en la propuesta de arquitectura.
    El navegador nunca habla directo con Flowable, Postgres o el HSM: todo
    pasa por este BFF. Ver seccion 8.1 "Contratos minimos del MVP" del
    documento de arquitectura para el detalle completo por dominio.
servers:
  - url: http://localhost:3000
    description: BFF local (docker compose)

paths:
  /cases:
    get:
      summary: Listar casos
      operationId: listCases
      parameters:
        - name: tenantId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de casos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Case' } }
    post:
      summary: Crear expediente/caso
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201':
          description: Caso creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }

  /cases/{id}:
    get:
      summary: Consultar caso
      operationId: getCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Caso encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '404': { description: No encontrado }

  /documents:
    get:
      summary: Listar documentos
      operationId: listDocuments
      parameters:
        - name: caseId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de documentos (sin contenido)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Document' } }
    post:
      summary: Registrar documento (metadatos + version inicial)
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentRequest' }
      responses:
        '201':
          description: Documento creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }

  /documents/{id}/content:
    get:
      summary: Descargar contenido (URL autorizada de corta duracion)
      operationId: getDocumentContent
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200': { description: Contenido o URL prefirmada }

  /workflows/{key}/instances:
    post:
      summary: Iniciar instancia de proceso (via Workflow Port -> Flowable)
      operationId: startWorkflowInstance
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, example: contrato-dos-partes }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartInstanceRequest' }
      responses:
        '201':
          description: Instancia iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowInstance' }

  /tasks:
    get:
      summary: Bandeja de tareas humanas (candidato o asignado)
      operationId: listTasks
      parameters:
        - name: assignee
          in: query
          schema: { type: string }
        - name: candidateGroup
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HumanTask' }

  /tasks/{id}/complete:
    post:
      summary: Completar tarea humana (idempotente)
      operationId: completeTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Tarea completada }

  /signature-requests:
    get:
      summary: Listar solicitudes de firma (bandeja de un firmante)
      operationId: listSignatureRequests
      parameters:
        - name: signerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [PENDIENTE, EN_FIRMA, COMPLETADA, RECHAZADA, EXPIRADA] }
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SignatureRequest' } }
    post:
      summary: Crear solicitud de firma independiente del workflow
      operationId: createSignatureRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSignatureRequest' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }

  /signature-requests/{id}/actions/sign:
    post:
      summary: Aplicar firma (digital, autografa o biometrica segun politica)
      operationId: signRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignAction' }
      responses:
        '200':
          description: Firma aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }

  /signature-requests/{id}/status:
    get:
      summary: Consultar estatus de una solicitud de firma
      operationId: getSignatureRequestStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estatus actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }

  /lookup-tables:
    get:
      summary: Listar tablas del tenant
      operationId: getlookuptables
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupTable'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
      x-required-roles:
      - admin
    post:
      summary: Crear tabla
      operationId: postlookuptables
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTable'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLookupTable'
  /lookup-tables/{id}:
    get:
      summary: Administrar tabla
      operationId: getlookuptablesid
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTable'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Administrar tabla
      operationId: putlookuptablesid
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTable'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLookupTable'
    delete:
      summary: Administrar tabla
      operationId: deletelookuptablesid
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '204':
          description: Operación completada
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /lookup-tables/{id}/rows:
    get:
      summary: Listar filas por cursor
      operationId: getlookuptablesidrows
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupRowsPage'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
          description: position:id
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: active
        in: query
        schema:
          type: boolean
    post:
      summary: Agregar fila
      operationId: postlookuptablesidrows
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupRow'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLookupRow'
  /lookup-tables/{id}/rows/{rowId}:
    put:
      summary: Editar fila
      operationId: putlookuptablesidrowsrowId
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupRow'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLookupRow'
    delete:
      summary: Eliminar fila
      operationId: deletelookuptablesidrowsrowId
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '204':
          description: Operación completada
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rowId
        in: path
        required: true
        schema:
          type: string
  /lookup-tables/{id}/rows/{rowId}/move:
    post:
      summary: Mover una fila
      operationId: postlookuptablesidrowsrowIdmove
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  moved:
                    type: boolean
                  index:
                    type: integer
                  position:
                    type: integer
                  total:
                    type: integer
                  revision:
                    type: integer
                  changed:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        position:
                          type: integer
                      additionalProperties: false
                additionalProperties: false
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveLookupRow'
  /lookup-tables/{id}/rows/import:
    post:
      summary: Importar filas (JSON; CSV/Excel se transforma en cliente)
      operationId: postlookuptablesidrowsimport
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: Solo administradores. Hasta 5000 filas y cuerpo de 12 MB; reemplazo transaccional.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  deleted:
                    type: integer
                  revision:
                    type: integer
                additionalProperties: false
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportLookupRows'
  /lookup-tables/{id}/rows/reorder:
    post:
      summary: Reordenar filas
      operationId: postlookuptablesidrowsreorder
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                properties:
                  reordered:
                    type: integer
                  revision:
                    type: integer
                additionalProperties: false
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderLookupRows'
  /lookup-tables/{id}/test:
    post:
      summary: Probar consulta sin escribir
      operationId: postlookuptablesidtest
      tags:
      - Consultas
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                  first:
                    type:
                    - object
                    - 'null'
                  explain:
                    type: array
                    items:
                      type: object
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestLookupQuery'
  /document-templates:
    get:
      summary: Listar formatos visibles
      operationId: getdocumenttemplates
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: all=true incluye borradores solo para admin.
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
      parameters:
      - name: all
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
    post:
      summary: Subir formato PDF
      operationId: postdocumenttemplates
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplateDetail'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                meta:
                  type: string
                  description: JSON de UpdateDocumentTemplate
              additionalProperties: false
              required:
              - file
              - meta
  /document-templates/form:
    post:
      summary: Crear o regenerar formato digital
      operationId: postdocumenttemplatesform
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: Solo administradores. Nunca publica automáticamente; sin PDF. 409 si el formato ya está publicado.
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplateDetail'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalFormRequest'
  /document-templates/{id}:
    get:
      summary: Consultar o administrar formato
      operationId: getdocumenttemplatesid
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: ''
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplateDetail'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Consultar o administrar formato
      operationId: putdocumenttemplatesid
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '200':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplateDetail'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentTemplate'
    delete:
      summary: Consultar o administrar formato
      operationId: deletedocumenttemplatesid
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '204':
          description: Operación completada
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
          description: Sin permiso o membresía de tenant
        '404':
          description: Recurso no encontrado en el ámbito del actor
        '409':
          description: Conflicto de estado o recurso en uso
      x-required-roles:
      - admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /document-templates/{id}/publish:
    post:
      summary: Cambiar publicación del formato
      operationId: postdocumenttemplatesidpublish
      tags:
      - Formatos y anexos
      security:
      - BearerAuth: []
      description: 'Solo administradores. '
      responses:
        '201':
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTemplateDetail'
        '400':
          description: Entrada inválida
        '401':
          description: Sin autenticación
        '403':
