          - PARALELO
        slaHours:
          type: number
        derived:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[A-Za-z][A-Za-z0-9_]{0,39}$
              label:
                type: string
              type:
                type: string
                enum:
                - text
                - number
                - date
                - select
              query:
                $ref: '#/components/schemas/LookupQuery'
              column:
                type: string
              onMiss:
                type: string
                enum:
                - empty
                - fail
            additionalProperties: false
            required:
            - key
            - label
            - type
            - query
            - column
      additionalProperties: false
      required:
      - variables
      - steps
      - order
      - slaHours
    AttachmentSpec:
      type: object
      properties:
        key:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,39}$
        label:
          type: string
        help:
          type: string
        required:
          type: boolean
        min:
          type: integer
          minimum: 0
          maximum: 20
        max:
          type: integer
          minimum: 1
          maximum: 20
        accept:
          type: array
          items:
            type: string
            enum:
            - pdf
            - image
            - excel
            - word
            - any
        maxSizeMB:
          type: number
          exclusiveMinimum: 0
          maximum: 25
      additionalProperties: false
      required:
      - key
      - label
      - required
      - min
      - max
      - accept
      - maxSizeMB
    DigitalFormRequest:
      type: object
