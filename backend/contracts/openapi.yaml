components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    CreateCaseRequest:
      type: object
      required: [tenantId, title]
      properties:
        tenantId: { type: string }
        title: { type: string, example: "Contrato de arrendamiento - Sucursal Polanco" }

    Case:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        title: { type: string }
        status: { type: string, enum: [ABIERTO, EN_PROCESO, CERRADO] }
        createdAt: { type: string, format: date-time }

    CreateDocumentRequest:
      type: object
      required: [caseId, filename, contentBase64]
      properties:
        caseId: { type: string }
        filename: { type: string }
        contentBase64: { type: string, description: "Contenido del PDF en base64 (MVP; en Fase 1 se sube a object storage)." }

    Document:
      type: object
      properties:
        id: { type: string }
        caseId: { type: string }
        version: { type: integer }
        hash: { type: string, description: "SHA-256 del contenido" }
        locked: { type: boolean }

    StartInstanceRequest:
      type: object
      required: [caseId]
      properties:
        caseId: { type: string }
        variables: { type: object, additionalProperties: true }

    WorkflowInstance:
      type: object
      properties:
        id: { type: string }
        processDefinitionKey: { type: string }
        caseId: { type: string }
        status: { type: string, enum: [ACTIVO, COMPLETADO, CANCELADO] }

    HumanTask:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        processInstanceId: { type: string }
        candidateGroups: { type: array, items: { type: string } }
        dueDate: { type: string, format: date-time, nullable: true }

    CreateSignatureRequest:
      type: object
      required: [documentId, signers, method]
      properties:
        documentId: { type: string }
        methods:
          type: array
          description: Métodos de firma autorizados para esta solicitud; cada firmante elige uno de estos al firmar.
          items: { type: string, enum: [DIGITAL, AUTOGRAFA, BIOMETRICA] }
        order: { type: string, enum: [SECUENCIAL, PARALELO] }
        requestedBy: { type: string }
        requestedByName: { type: string }
        signers:
          type: array
          items:
            type: object
            properties:
              signerId: { type: string }
              name: { type: string }
              email: { type: string }
              role: { type: string, enum: [FIRMANTE, REVISOR] }

    SignAction:
      type: object
      required: [signerId, method]
      properties:
        signerId: { type: string }
        method: { type: string, enum: [DIGITAL, AUTOGRAFA, BIOMETRICA] }
        consentVersion: { type: string }

    SignatureRequest:
      type: object
      properties:
        id: { type: string }
        documentId: { type: string }
        status: { type: string, enum: [PENDIENTE, EN_FIRMA, COMPLETADA, RECHAZADA, EXPIRADA] }
        methods:
          type: array
          items: { type: string, enum: [DIGITAL, AUTOGRAFA, BIOMETRICA] }
        requestedBy: { type: string }
        requestedByName: { type: string }
        createdAt: { type: string, format: date-time }
        signers:
          type: array
          items:
            type: object
            properties:
              signerId: { type: string }
              name: { type: string }
              email: { type: string }
              role: { type: string, enum: [FIRMANTE, REVISOR] }
              status: { type: string, enum: [PENDIENTE, FIRMADO, RECHAZADO] }
              signedAt: { type: string, format: date-time, nullable: true }
              usedMethod: { type: string, enum: [DIGITAL, AUTOGRAFA, BIOMETRICA] }

    LookupColumn:
      type: object
      properties:
        key:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,39}$
        label:
          type: string
          maxLength: 120
        type:
          type: string
          enum:
          - text
          - number
          - date
          - select
        options:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - key
      - label
      - type
    LookupCondition:
      type: object
      properties:
        column:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,39}$
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - contains
          - notContains
          - startsWith
          - endsWith
          - in
          - notIn
          - isEmpty
          - isNotEmpty
        source:
          oneOf:
          - type: object
            properties:
              var:
                type: string
            additionalProperties: false
            required:
            - var
          - type: object
            properties:
              value:
                type:
                - string
                - number
            additionalProperties: false
            required:
            - value
        emptyMatchesAny:
          type: boolean
          default: true
      additionalProperties: false
      required:
      - column
      - op
    LookupQuery:
      type: object
      properties:
        table:
          type: string
        match:
          type: array
          items:
            $ref: '#/components/schemas/LookupCondition'
      additionalProperties: false
      required:
      - table
      - match
    CreateLookupTable:
      type: object
      properties:
        key:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        columns:
          type: array
          items:
            $ref: '#/components/schemas/LookupColumn'
          maxItems: 30
      additionalProperties: false
      required:
      - key
      - name
      - columns
    UpdateLookupTable:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        columns:
          type: array
          items:
            $ref: '#/components/schemas/LookupColumn'
          maxItems: 30
        active:
          type: boolean
      additionalProperties: false
    LookupTable:
      type: object
      properties:
        key:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        columns:
          type: array
          items:
            $ref: '#/components/schemas/LookupColumn'
          maxItems: 30
        id:
          type: string
          format: uuid
        revision:
          type: integer
        active:
          type: boolean
        rowCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - key
      - name
      - columns
      - revision
      - active
      - rowCount
    LookupRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        values:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - 'null'
        position:
          type: integer
        active:
          type: boolean
      additionalProperties: false
      required:
      - id
      - values
      - position
      - active
    CreateLookupRow:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - 'null'
      additionalProperties: false
      required:
      - values
    UpdateLookupRow:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - 'null'
        active:
          type: boolean
      additionalProperties: false
    MoveLookupRow:
      oneOf:
      - type: object
        properties:
          direction:
            type: string
            enum:
            - up
            - down
        additionalProperties: false
        required:
        - direction
      - type: object
        properties:
          toTop:
            const: true
        additionalProperties: false
        required:
        - toTop
      - type: object
        properties:
          afterRowId:
            type:
            - string
            - 'null'
            maxLength: 64
        additionalProperties: false
        required:
        - afterRowId
    ImportLookupRows:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type:
              - string
              - number
              - 'null'
          maxItems: 5000
        replace:
          type: boolean
      additionalProperties: false
      required:
      - rows
    ReorderLookupRows:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 5000
      additionalProperties: false
      required:
      - ids
    TestLookupQuery:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/LookupQuery'
        inputs:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - 'null'
      additionalProperties: false
      required:
      - query
    LookupRowsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookupRow'
        nextCursor:
          type:
          - string
          - 'null'
        total:
          type: integer
      additionalProperties: false
      required:
      - items
      - nextCursor
      - total
    FlowVariable:
      type: object
      properties:
        key:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,39}$
        label:
          type: string
        type:
          type: string
          enum:
          - text
          - number
          - date
          - select
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - key
      - label
      - type
      - required
    FlowParticipant:
      oneOf:
      - type: object
        properties:
          type:
            const: initiator
        additionalProperties: false
        required:
        - type
      - type: object
        properties:
          type:
            const: fixed
          signerId:
            type: string
          name:
            type: string
          email:
            type: string
        additionalProperties: false
        required:
        - type
        - signerId
      - type: object
        properties:
          type:
            const: ask
          prompt:
            type: string
        additionalProperties: false
        required:
        - type
        - prompt
      - type: object
        properties:
          type:
            const: lookup
          query:
            $ref: '#/components/schemas/LookupQuery'
          person:
            type: object
            properties:
              signerId:
                type: string
              name:
                type: string
              email:
                type: string
            additionalProperties: false
            required:
            - signerId
          prompt:
            type: string
        additionalProperties: false
        required:
        - type
        - query
        - person
        - prompt
    FlowCondition:
      type: object
      properties:
        variable:
          type: string
        op:
          type: string
          enum:
          - '>'
          - '>='
          - <
          - <=
          - ==
          - '!='
        value:
          type:
          - string
          - number
      additionalProperties: false
      required:
      - variable
      - op
      - value
    FlowStep:
      type: object
      properties:
