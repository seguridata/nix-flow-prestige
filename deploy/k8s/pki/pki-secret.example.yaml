# EJEMPLO, NO se aplica con kustomize. Los valores son placeholders: ningún material criptográfico real va en el repo.
# Forma recomendada de crear el Secret real (sin YAML, desde archivos generados fuera del clúster): ver deploy/k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: prestige-pki
  namespace: prestige
type: Opaque
stringData:
  root.cert.pem: "CHANGE_ME: certificado PEM de la CA raiz (solo el certificado)"
  intermediate.cert.pem: "CHANGE_ME: certificado PEM de la CA intermedia"
  intermediate.key.pem: "CHANGE_ME: llave privada PEM de la intermedia (la que emite los certificados de firmante)"
  manifest-signing.key.pem: "CHANGE_ME: llave Ed25519 PKCS8 PEM para firmar el manifiesto de evidencia"
  manifest-signing.pub.pem: "CHANGE_ME: llave publica SPKI PEM correspondiente"
