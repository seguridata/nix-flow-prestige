# EJEMPLO: no se incluye en kustomization.yaml. En producción los secretos vienen de un gestor externo
# (External Secrets Operator + Secret Manager/Vault); nunca se versionan valores reales.
apiVersion: v1
kind: ConfigMap
metadata: { name: prestige-config }
data:
  TEMPORAL_ADDRESS: temporal-frontend.temporal:7233
  S3_ENDPOINT: https://storage.googleapis.com   # o el endpoint S3 gestionado
  S3_BUCKET: prestige-docs
  KEYCLOAK_ISSUER: https://auth.example.com/realms/prestige
  DEFAULT_TENANT_SLUG: ""          # vacío: no se crea ningún tenant por defecto en producción
  AI_RPM_PER_TENANT: "10"
  AI_MONTHLY_PER_TENANT: "300"
  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: "20"
  KEEP_ALIVE_TIMEOUT_MS: "65000"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prestige-web-config }
data:
  BFF_URL: http://bff:3000
  OIDC_CLIENT_ID: prestige-web
  OIDC_REDIRECT_URI: https://prestige.example.com/api/auth/callback
  OIDC_POST_LOGOUT_REDIRECT: https://prestige.example.com/login
---
# Valores que deben existir en prestige-secrets (el BFF falla al arrancar en producción si faltan los marcados *).
# DATABASE_URL (con ?connection_limit=10&pool_timeout=10, o PgBouncer en modo transacción), REDIS_URL,
# STORAGE_MASTER_KEY*, PKI_PASSPHRASE*, WORKER_SHARED_SECRET*, S3_ACCESS_KEY*, S3_SECRET_KEY*, XAI_API_KEY.
# prestige-web-secrets: SESSION_SECRET, REDIS_URL (la sesión se guarda en Redis, no en la cookie).
# prestige-pki: la PKI (CA y manifest-signing.key.pem) como Secret, o KMS/PKCS#11 con KEY_CUSTODIAN=pkcs11.
apiVersion: v1
kind: Secret
metadata: { name: prestige-secrets }
type: Opaque
stringData: { REPLACE_ME: "usar External Secrets" }
